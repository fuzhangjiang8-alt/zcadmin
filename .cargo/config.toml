# =============================================================================
# Cargo 工作区配置
#
# 职责：提供 AGENTS.md / README 中约定的 `cargo xtask ...` 命令别名。
# 边界：只做命令转发，不改变编译参数、不引入环境相关路径。
# 关键约束：别名必须与 CI（.github/workflows/ci.yml）使用的形式保持一致，
#           避免出现「文档里的命令本地跑不了、CI 里又写成另一种形式」。
# =============================================================================

[alias]
# `cargo xtask verify` → `cargo run -p xtask -- verify`
xtask = "run -p xtask --"
